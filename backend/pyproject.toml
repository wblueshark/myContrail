[project]
name = "contrail"
version = "0.1.0"
description = "Contrail - personal location-history aggregation and visualization"
requires-python = ">=3.12,<3.13"

dependencies = [
    # ── Web framework ─────────────────────────────────────
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",      # file uploads

    # ── Database ──────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.36",
    "geoalchemy2>=0.16",
    "psycopg[binary,pool]>=3.2",     # psycopg3: sync for Alembic, async for FastAPI
    "alembic>=1.14",

    # ── Task queue ────────────────────────────────────────
    # NOTE: ARQ only orchestrates. CPU-bound work must go to a
    # ProcessPoolExecutor, otherwise the event loop blocks and progress
    # reporting / job cancellation silently stop working.
    "arq>=0.26",
    "redis>=5.2",

    # ── Parsers ───────────────────────────────────────────
    "ijson>=3.3",                     # streaming parse of large Google exports
    "exifread>=3.0",                  # photo EXIF (fast, read-only)
    "lxml>=5.3",                      # GPX / TCX; use iterparse for streaming
    "fitparse>=1.2",                  # NOTE: semicircles + Garmin epoch (1989-12-31)
    "python-dateutil>=2.9",

    # ── Imaging ───────────────────────────────────────────
    # NOTE: always use Image.draft() for DCT-scaled JPEG decoding.
    # Measured 2.5x speedup (12ms -> 5ms) on a 4000x3000 image.
    "pillow>=11.0",
    "pillow-heif>=0.20",              # HEIC; requires system libheif

    # ── Geo / timezone ────────────────────────────────────
    # timezonefinder is required, not optional: timelinePath records carry
    # UTC-only timestamps, so the zone must be resolved from coordinates.
    "timezonefinder>=6.5",
    "shapely>=2.0",
    "numpy>=2.0",

    # ── Rendering ─────────────────────────────────────────
    # Pillow's ImageDraw.line() has no antialiasing and produces hard
    # stair-stepped edges. Pillow does layout/compositing, cairo draws vectors.
    "pycairo>=1.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",                    # TestClient
    "hypothesis>=6.120",              # property tests (coord round-trip, duration conservation)
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# B008 flags a function call in a default argument. FastAPI's whole dependency
# system is expressed that way, so these calls are declarations, not shared
# mutable state.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.File",
    "fastapi.Form",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    # CI blocking: a run where these SKIPPED is not a passing run. They need
    # PostGIS with the fence functions installed.
    "privacy: privacy-fence regression tests",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["contrail*"]
