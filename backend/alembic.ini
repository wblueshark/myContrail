; Alembic configuration.
;   alembic -c backend/alembic.ini upgrade head
;
; The database URL is not stored here - env.py reads it from CONTRAIL settings
; (.env / environment), so credentials never land in a tracked file.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
